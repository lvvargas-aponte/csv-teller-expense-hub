services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: expense_hub
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense_dev}
    ports:
      # Host 15432 avoids collision with a locally installed Postgres.
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_hub"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # host.docker.internal resolves to the Docker host on Docker Desktop (Windows/Mac).
      # Override if Ollama runs on a different host/port.
      - OLLAMA_HOST=http://host.docker.internal:11434
      - DATABASE_URL=postgresql+asyncpg://expense:${POSTGRES_PASSWORD:-expense_dev}@db:5432/expense_hub
    volumes:
      - ./backend:/app
      # Shares the real .env with the container at the exact path config.py /
      # helpers.py resolve to (Path(__file__).parent.parent from /app == "/").
      # Without this, connections saved at runtime (SimpleFIN access URLs,
      # Teller tokens) write to the container's own throwaway filesystem
      # instead of this file, and vanish the next time the container is
      # recreated (rebuild, `docker compose down`, etc.) rather than just
      # restarted.
      - ./.env:/.env
      # Built mkdocs site for the in-app Help button (served at /help).
      # Run `mkdocs build` from the project root to populate; otherwise the
      # mount is empty and the backend logs a warning at startup.
      - ./site:/site:ro
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      docs:
        condition: service_completed_successfully

  # Docs builder. Runs once on `docker compose up`, writes ./site, exits.
  # Backend waits for it (service_completed_successfully) so /help is always
  # in sync with the docs/ source on boot.
  # For live preview instead: `docker compose --profile docs-serve up docs-serve` on :8001.
  docs:
    image: squidfunk/mkdocs-material:9
    working_dir: /docs
    volumes:
      - ./:/docs
    command: build --strict
    networks:
      - app-network

  docs-serve:
    image: squidfunk/mkdocs-material:9
    working_dir: /docs
    volumes:
      - ./:/docs
    ports:
      - "8001:8000"
    profiles: ["docs-serve"]
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8000
      - HOST=0.0.0.0
      # Use polling for file-watch hot-reload — inotify is unreliable in Docker
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-network
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
