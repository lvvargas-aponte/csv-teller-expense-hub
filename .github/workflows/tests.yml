name: tests

# Both jobs here are deliberately database-free so they stay fast and can
# never be blocked on a Postgres service container. The integration suite
# (backend/tests) needs a real pgvector database and is not run here yet.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend-unit:
    name: backend/tests_unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the backend Dockerfile.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # backend/tests_unit/conftest.py puts backend/ on sys.path and swaps
      # PgStore -> InMemoryStore before importing main, so no DATABASE_URL
      # and no live database are required.
      - name: Run unit tests
        run: pytest backend/tests_unit -q

  frontend-unit:
    name: frontend jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      # CI=true makes CRA treat ESLint warnings as errors, so this catches
      # lint regressions (a11y, exhaustive-deps, eqeqeq) that `npm test`
      # does not.
      - name: Build
        run: npm run build
        env:
          CI: true
